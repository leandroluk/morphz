<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>morphz</title>
    <link rel="icon" type="image/svg+xml" href="assets/morphz.svg" />
    <link rel="alternate icon" href="assets/morphz-128.png" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta
      name="description"
      content="Zod v4 + a class-based, type-safe OO layer: Struct entities, Define meta-types, real class instances."
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0" />

    <!-- Docsify Themeable (Simple theme) -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css"
    />

    <!-- Code highlight theme (Prism Tomorrow) -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/prismjs@1/themes/prism-tomorrow.min.css"
    />

    <style>
      :root {
        /* Teal accent */
        --theme-color: #0d9488;
        --base-font-size: 16px;
        --heading-color: #134e4a;
        --strong-color: #0f2e2b;
        --sidebar-background: #f5faf9;
        --sidebar-width: 280px;
        --content-max-width: 900px;
        --code-theme-background: #2d2d2d;
        --code-inline-background: #ecfdf5;
        --code-inline-color: #0f2e2b;
        --code-inline-border-radius: 4px;
        --link-color: #0d9488;
        --link-color--hover: #0f766e;
      }

      body {
        font-family:
          "Outfit",
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Helvetica,
          Arial,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .markdown-section pre {
        border-radius: 12px;
        box-shadow:
          0 4px 6px -1px rgb(0 0 0 / 0.1),
          0 2px 4px -2px rgb(0 0 0 / 0.1);
        border: 1px solid #3e3e3e;
        margin: 1.5em 0;
        background-color: #2d2d2d !important;
      }

      .markdown-section pre code {
        color: #f8f8f2 !important;
        font-family:
          "Fira Code", Consolas, Monaco, "Andale Mono", "Ubuntu Mono", monospace !important;
      }

      .sidebar {
        border-right: 1px solid #d7ebe8;
      }

      .sidebar-nav li a {
        font-weight: 500;
        color: #4b6560;
        transition: color 0.2s ease;
      }

      .sidebar-nav li.active > a {
        color: var(--theme-color);
        font-weight: 600;
        border-right: 2px solid var(--theme-color);
      }

      .markdown-section img[alt="morphz"] {
        max-width: 100%;
        border-radius: 12px;
      }

      .app-name-link {
        color: var(--theme-color) !important;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div id="app">Loading documentation...</div>
    <script>
      window.$docsify = {
        name: "morphz",
        repo: "https://github.com/leandroluk/morphz",
        loadSidebar: true,
        subMaxLevel: 3,
        auto2top: true,
        search: {
          maxAge: 86400000,
          paths: "auto",
          placeholder: "Search...",
          noData: "No results found!",
          depth: 6,
        },
        copyCode: {
          buttonText: "Copy",
          errorText: "Error",
          successText: "Copied!",
        },
      };
    </script>
    <!-- Docsify v4 -->
    <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
    <!-- Plugins -->
    <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
    <!-- Prism extra languages -->
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-typescript.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  </body>
</html>
